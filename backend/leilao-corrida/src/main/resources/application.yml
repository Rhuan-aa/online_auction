spring:
  application:
    name: leilao-corrida
  datasource:
    url: ${CORRIDA_DB_URL:jdbc:postgresql://localhost:5432/leilao}
    username: ${CORRIDA_DB_USER:postgres}
    password: ${CORRIDA_DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 3
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      properties:
        linger.ms: 0
    consumer:
      auto-offset-reset: earliest
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
server:
  port: 8085
  address: ${CORRIDA_BIND:127.0.0.1}
corrida:
  pool-por-arquitetura: ${CORRIDA_POOL_POR_ARQUITETURA:8}
  semente-padrao: 42
  max-threads: ${CORRIDA_MAX_THREADS:1000000}
  max-lances: ${CORRIDA_MAX_LANCES:2000000}
logging:
  level:
    org.apache.kafka: WARN
