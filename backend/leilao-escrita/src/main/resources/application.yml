spring:
  application:
    name: leilao-escrita
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/leilao}
    username: ${DB_COMMAND_USER:command_svc}
    password: ${DB_COMMAND_PASSWORD:command_svc}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Curtos de propósito: com o Redis fora do ar, o pedido desiste logo e segue pelo banco.
      timeout: 200ms
      connect-timeout: 200ms
server:
  port: 8081
management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    redis:
      # O Redis é só cache: se ele cair, o serviço continua funcionando (ADR-003),
      # então ele não deve deixar o /actuator/health do serviço como DOWN.
      enabled: false
