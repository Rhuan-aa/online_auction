spring:
  application:
    name: leilao-escrita
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/leilao}
    username: ${DB_COMMAND_USER:command_svc}
    password: ${DB_COMMAND_PASSWORD:command_svc}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 200ms
      connect-timeout: 200ms
server:
  port: 8081
leilao:
  cache:
    configuracao: ${CACHE_CONFIGURACAO:C}
management:
  endpoints:
    web:
      exposure:
        include: health, metrics
      cors:
        allowed-origins: http://localhost:5173
        allowed-methods: GET
  health:
    redis:
      enabled: false
