spring:
  application:
    name: leilao-escrita
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/leilao}
    username: ${DB_COMMAND_USER:command_svc}
    password: ${DB_COMMAND_PASSWORD:command_svc}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Curtos de propósito: com o Redis fora do ar, o pedido desiste logo e segue pelo banco.
      timeout: 200ms
      connect-timeout: 200ms
server:
  port: 8081
leilao:
  cache:
    # Valor inicial; troca em tempo de execução por /admin/cache/configuracao.
    # A = sem cópia (relê todos os eventos), B = só checkpoint, C = Redis + checkpoint (ADR-003).
    # Ex.: CACHE_CONFIGURACAO=A para começar medindo o custo sem cache.
    configuracao: ${CACHE_CONFIGURACAO:C}
management:
  endpoints:
    web:
      exposure:
        include: health, metrics
      # O painel de ADM (front) lê /actuator/metrics direto do navegador.
      cors:
        allowed-origins: http://localhost:5173
        allowed-methods: GET
  health:
    redis:
      # O Redis é só cache: se ele cair, o serviço continua funcionando (ADR-003),
      # então ele não deve deixar o /actuator/health do serviço como DOWN.
      enabled: false
