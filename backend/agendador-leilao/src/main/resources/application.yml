spring:
  application:
    name: agendador-leilao
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
server:
  port: 8084
management:
  endpoints:
    web:
      exposure:
        include: health
      # O painel de arquitetura (front) lê /actuator/health direto do navegador.
      cors:
        allowed-origins: http://localhost:5173
        allowed-methods: GET
