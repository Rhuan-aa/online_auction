spring:
  application:
    name: ferramentas
  main:
    web-application-type: none
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/leilao}
    username: ${DB_COMMAND_USER:command_svc}
    password: ${DB_COMMAND_PASSWORD:command_svc}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
leilao:
  cache:
    configuracao: C
