spring:
  application:
    name: leilao-leitura
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/leilao}
    # Só leitura: SELECT nos eventos e no checkpoint (infra/sql/003_roles.sql e 004_checkpoint.sql).
    username: ${DB_QUERY_USER:query_svc}
    password: ${DB_QUERY_PASSWORD:query_svc}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Curtos de propósito: com o Redis fora do ar, a consulta desiste logo e segue pelo banco.
      timeout: 200ms
      connect-timeout: 200ms
server:
  port: 8082
management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    redis:
      # O Redis é só cache: se ele cair, a leitura continua funcionando (ADR-003).
      enabled: false
